name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Build runs before the test step, not after: the routing smoke test
      # asserts against `dist/client`, so it needs build output to exist.
      # See docs/decisions/ADR-010-ci-pipeline.md.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
