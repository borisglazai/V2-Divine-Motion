name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Build runs before the test step, not after: the routing smoke test
      # asserts against `dist/client`, so it needs build output to exist.
      # See docs/decisions/ADR-010-ci-pipeline.md.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # D1 foundation (Implementation Brief 010): applies migrations/0001_initial.sql
      # to a real local D1 via Wrangler/Miniflare (not just a bare SQLite file),
      # then runs the invariant suite against it. Independent of the Astro build
      # above; kept as its own steps so a DB regression is reported separately
      # from a frontend one. See docs/TEST_PLAN.md "D1 invariants".
      - name: Migrate local D1
        run: npm run db:migrate:local

      - name: D1 invariant tests
        run: npm run db:test
