name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Build runs before the test step, not after: the routing smoke test
      # asserts against `dist/client`, so it needs build output to exist.
      # See docs/decisions/ADR-010-ci-pipeline.md.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Admin Security Foundation (Brief 012). Auth unit tests are pure
      # (real signed JWTs verified against a local JWKS, no network/D1) so
      # they run right alongside the frontend test above. The HTTP route
      # suite needs the build output from the Build step above (it spawns
      # `astro preview` against dist/) — see tests/admin/routes.test.mjs
      # for exactly what it does and does not prove.
      - name: Auth tests
        run: npm run test:auth

      - name: Admin route tests
        run: npm run test:admin

      # D1 foundation (Brief 010) + Data Access Layer (Brief 011, incl. the
      # admin dashboard summary read added in Brief 012): applies
      # migrations/0001_initial.sql to a real local D1 via Wrangler/
      # Miniflare, then runs both test suites against it — the schema
      # invariants (tests/db/, ~27 tests via the Wrangler CLI, ~220s) and
      # the DAL suite (tests/dal/, ~38 tests via Miniflare's Node API
      # directly against the real TypeScript repositories, ~11s).
      # `npm run db:test` also runs tests/db/migration-0003-sequencing.test.mjs
      # (Brief 014) — its own isolated persistence directories, proving 0003
      # applies fresh, re-applies idempotently, and upgrades an
      # 0001+0002-only database with a correct authorized_at backfill.
      # Independent of the Astro build above; kept as its own steps so a
      # DB regression is reported separately from a frontend one. See
      # docs/TEST_PLAN.md "D1 invariants" / "Data Access Layer".
      - name: Migrate local D1
        run: npm run db:migrate:local

      - name: D1 + DAL tests
        run: npm run db:test

      # CMS Travail (Implementation Brief 013). work-validation.test.ts is
      # pure (no D1). work-endpoints.test.ts calls the real
      # src/lib/admin/work-actions.ts functions against their own isolated
      # local D1 via the same Miniflare harness as the DAL suite
      # (tests/dal/harness.ts) — independent of the "Migrate local D1"
      # step above, kept sequential only for clearer failure attribution.
      - name: CMS Travail tests
        run: npm run test:cms:work

      # Services CMS — second real CMS module after Travail.
      # services-validation.test.ts is pure (no D1). services-endpoints.test.ts
      # calls the real src/lib/admin/services-actions.ts functions against
      # their own isolated local D1 via the same Miniflare harness as the
      # DAL suite (tests/dal/harness.ts) — same independence as CMS
      # Travail's suite above.
      - name: CMS Services tests
        run: npm run test:cms:services

      # Témoignages CMS — third real CMS module. Same shape as Services'
      # step above (testimonials.ts already had its full rights-gate
      # trigger set from 0001/0002, so no migration for this brief).
      - name: CMS Testimonials tests
        run: npm run test:cms:testimonials

      # Éditeur visuel Phase 1 — the fourth CMS-adjacent module: singleton
      # page-content editors (home_content, services_page_content) behind
      # /admin/site/**. site-editor-validation.test.ts is pure (no D1).
      # site-editor-endpoints.test.ts calls the real
      # src/lib/admin/home-editor-actions.ts / services-page-editor-actions.ts
      # functions against their own isolated local D1 via the same
      # Miniflare harness (tests/dal/harness.ts) — same independence as
      # every CMS suite above.
      - name: Éditeur visuel (site editor) tests
        run: npm run test:cms:site-editor

      # Media Library + R2 upload foundation (Implementation Brief 014).
      # tests/storage/*.test.ts are pure (no D1/R2/network — key
      # generation, magic-byte/dimension parsing, SigV4 presign
      # construction). tests/admin/media-actions.test.ts calls the real
      # src/lib/admin/media-actions.ts functions against their own
      # isolated local D1 + R2 via tests/dal/harness.ts (extended in this
      # brief with getTestBucket()) — same independence from the "Migrate
      # local D1" step as the CMS Travail suite above.
      - name: Storage unit tests
        run: npm run test:storage

      - name: Media Library tests
        run: npm run test:media

      # Public Travail/Services/Home pages + public media route
      # (Validation Brief 014S, extended by the Services and Témoignages
      # CMS briefs). Pure adapter tests (work-gallery-adapter,
      # service-layout) plus the real authorization chain
      # (resolvePublicMediaObject, now recognizing work_items, services,
      # AND testimonials usage) against their own isolated local D1 + R2
      # via tests/dal/harness.ts — same independence as the suites above.
      - name: Public work/services/home page tests
        run: npm run test:public
