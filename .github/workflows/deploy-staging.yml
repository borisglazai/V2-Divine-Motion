name: Deploy Staging

# ---------------------------------------------------------------------------
# DISABLED (Production Readiness — Step 1 closure, 2026-09-22). Every run of
# this workflow (#7, #8, and every retry after — real Cloudflare API token,
# both the new "Specified Workers -> Editor" granular grant AND a classic
# account-wide "Workers Scripts: Write" grant, plus a wrangler bump from
# 4.131.2 to 4.136.3) failed identically:
#
#   Authentication error [code: 10000]
#   on GET /accounts/<account>/workers/services/v2-divine-motion
#
# This is Wrangler's own pre-deploy existence/ownership check (called by
# `wrangler deploy` before it ever uploads anything), not a permission this
# repo's config or CLAUDE.md guidance controls — see the "AUDIT BLOQUANT"
# and "STRATÉGIE DE CONTOURNEMENT" investigations in this branch's history
# for the full trace (wrangler.toml `[env.staging].name`, the
# `dist/server/wrangler.json` redirect, `CLOUDFLARE_ENV`, and finally the
# token/permissions audit). It matches dated, near-simultaneous community
# reports of the same failure on the same endpoint, right after Cloudflare's
# Workers granular-authorization GA (2026-09-15) — a live Cloudflare-side
# issue, not something fixable from this repo.
#
# **The validated staging deployment path is now Cloudflare Workers Builds /
# Git integration**, already connected to borisglazai/V2-Divine-Motion on
# validation/staging-cloudflare, deploying straight from Cloudflare's own
# infrastructure (no GitHub Actions, no CLOUDFLARE_API_TOKEN in this repo's
# secrets involved in that path at all) — see
# docs/REAL_STAGING_VALIDATION_REPORT_CONTACT_STEP1.md for the real,
# manually-confirmed validation done through that path.
#
# `if: false` below turns every job step into a no-op — the workflow stays
# runnable from the Actions UI (workflow_dispatch, so this is discoverable,
# not deleted) but does nothing if triggered by accident, rather than
# burning a run on a call already known to fail. To re-enable once Cloudflare
# resolves the `/workers/services/*` issue (or a fix ships in a future
# Wrangler release): remove the `if: false` line below and re-verify with a
# manual run before relying on it again.
# ---------------------------------------------------------------------------
#
# Manual-only, staging-only deployment (Production Readiness — Step 1
# follow-up). Deliberately a SEPARATE workflow from ci.yml (which only
# lints/typechecks/builds/tests and never deploys anywhere) so a staging
# deploy is always an explicit, human-triggered action — never a side
# effect of a push or a PR.
#
# No production target exists anywhere in this file: wrangler.toml itself
# has no [env.production] section (see its own comments), so
# `wrangler deploy --env staging` has no production Worker/D1/R2/KV/DNS to
# reach even if this workflow were run against a different git ref — the
# branch guard below is a second, explicit layer on top of that, not the
# only one.
on:
  workflow_dispatch:

jobs:
  deploy-staging:
    if: false # DISABLED — see header comment. Cloudflare Builds/Git integration is the validated staging deploy path.
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      # Fails the run outright (not a silent skip) if triggered from any
      # ref other than validation/staging-cloudflare — workflow_dispatch
      # lets the person running it pick an arbitrary branch/tag in the
      # GitHub UI, so this is the only thing that actually enforces it.
      - name: Guard — validation/staging-cloudflare only
        run: |
          if [ "${{ github.ref }}" != "refs/heads/validation/staging-cloudflare" ]; then
            echo "::error::deploy-staging.yml only deploys from validation/staging-cloudflare (got '${{ github.ref }}'). Refusing to run."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # @astrojs/cloudflare's server entrypoint (wrangler.toml's `main`)
      # is built output, not source — `wrangler deploy` needs dist/ to
      # exist first, same as the CI workflow's own build step.
      #
      # CLOUDFLARE_ENV: `wrangler deploy` reads dist/server/wrangler.json
      # (a redirected config @astrojs/cloudflare generates at build time),
      # not wrangler.toml directly. @cloudflare/vite-plugin only bakes
      # [env.staging]'s name/D1/R2/KV/vars into that generated file when
      # this variable is set at build time — confirmed by reading its
      # source and by a real local build/dry-run. Without it, `--env
      # staging` on the deploy step below is silently ignored.
      - name: Build
        env:
          CLOUDFLARE_ENV: staging
        run: npm run build

      # Deploys ONLY the staging environment declared in wrangler.toml's
      # [env.staging] section (its own D1/R2/KV bindings and vars) — never
      # touches the application secrets already configured directly in
      # Cloudflare (TURNSTILE_SECRET_KEY, RESEND_API_KEY, etc. — this
      # workflow neither reads nor sets them) and never creates or
      # modifies any DNS record.
      - name: Deploy to Cloudflare Workers (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
