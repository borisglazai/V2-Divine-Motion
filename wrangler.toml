name = "divine-motion-v2"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]
[assets]
binding = "ASSETS"
directory = "./dist"
# ---------------------------------------------------------------------------
# D1 — Data Architecture (Brief 009/009A), D1 Foundation (Brief 010).
# D1 holds structured content metadata only, never binaries (see
# docs/DATA_ARCHITECTURE.md, ADR-005/ADR-006 for R2/media).
#
# Binding name: DB. Used by `wrangler d1 migrations apply DB --local` and by
# the local test/seed scripts in this repo. Not yet read by any application
# code — this Worker does not reach into env.DB anywhere (Brief 010 is
# foundation only, no CMS/frontend wiring, see docs/DATA_ARCHITECTURE.md
# "Phase 4/5 — Persistence Foundation").
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "divine-motion-v2-local"
# Placeholder — not a real Cloudflare resource id. `wrangler d1 migrations
# apply DB --local` only needs *some* value here to key its local Miniflare
# SQLite file; no `wrangler d1 create` has been run against any real
# Cloudflare account, and nothing in this repo talks to remote D1. See
# docs/DEPLOYMENT.md "D1 environments" for the real staging/production
# provisioning steps (manual, run by whoever holds Cloudflare access).
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# Staging — NOT provisioned by this repo. `wrangler d1 create
# divine-motion-v2-staging` must be run once, manually, against the real
# Cloudflare account, and its real database_id pasted into
# [env.staging.d1_databases] below before any staging migration can run.
# This section is intentionally left as a placeholder — see
# docs/DEPLOYMENT.md for the exact procedure. No migration has been applied
# to it from this session (Brief 010 scope: local only).
# ---------------------------------------------------------------------------
[env.staging]
[[env.staging.kv_namespaces]]
binding = "SESSION"
id = "e3be4efe99f745acb0b2ac8be5a230d2"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "divine-motion-v2-staging"
database_id = "de8bf99e-45c2-407a-b435-52148b379bf2"
migrations_dir = "migrations"

# Production is deliberately NOT declared here. No production D1 binding,
# no production database_id, invented or otherwise — see
# docs/DEPLOYMENT.md and Implementation Brief 010 §26.

# ---------------------------------------------------------------------------
# Cloudflare Access — Admin Foundation (Implementation Brief 012).
# Not secrets in Cloudflare's own model (the team domain and AUD tag both
# travel inside the JWT itself, unlike an API token), but never real values
# in this file regardless: local/staging need their own `[vars]`
# (committed placeholders below); production sets its own via the
# Cloudflare dashboard/CI secrets, never committed. See
# docs/ADMIN_SECURITY.md for the real Access application provisioning
# procedure (manual, run by whoever holds Cloudflare Access — not done by
# this brief).
#
# CF_ACCESS_TEAM_DOMAIN — the Cloudflare Access team domain (e.g.
# "divinemotion.cloudflareaccess.com"). src/lib/auth/access.ts derives both
# the expected JWT issuer ("https://<team-domain>") and the JWKS URL
# ("https://<team-domain>/cdn-cgi/access/certs") from it — never hardcoded.
# CF_ACCESS_AUD — the Access application's Audience (AUD) tag, checked
# against the JWT's `aud` claim.
#
# The placeholders below are deliberately not a real Cloudflare hostname:
# with no real Access application behind them, JWT verification against
# them always fails closed (a JWKS fetch that can never succeed) — there is
# no usable bypass through these values. The only way into /admin locally
# is the strict `import.meta.env.DEV` mock-identity bypass in
# src/lib/auth/guard.ts, which Vite statically compiles to `false` (and
# therefore removes) in any `astro build` — see docs/ADMIN_SECURITY.md.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# R2 S3 API config — Implementation Brief 014. Presigned upload URLs use
# R2's S3-compatible API (see docs/decisions/ADR-017-r2-direct-upload-lifecycle.md),
# a SEPARATE credential surface from the R2Bucket binding declared further
# below: it needs an actual R2 API token (Account ID, Access Key ID,
# Secret Access Key), not just a Worker binding.
#
# R2_ACCOUNT_ID / R2_BUCKET_NAME are NOT secrets (identifiers needed to
# build the S3 endpoint URL, same category as CF_ACCESS_* above) —
# committed here as explicit placeholders. R2_ACCESS_KEY_ID /
# R2_SECRET_ACCESS_KEY ARE real secrets and are deliberately ABSENT from
# this file entirely, in every environment, including as placeholders:
# local development reads them from `.dev.vars` (gitignored — see
# `.dev.vars.example`), staging/production from `wrangler secret put
# R2_ACCESS_KEY_ID`/`R2_SECRET_ACCESS_KEY` (`--env staging` for staging) —
# see docs/DEPLOYMENT.md "R2 credentials".
# ---------------------------------------------------------------------------
[vars]
CF_ACCESS_TEAM_DOMAIN = "REPLACE_WITH_REAL_TEAM_DOMAIN.cloudflareaccess.com"
CF_ACCESS_AUD = "REPLACE_WITH_REAL_ACCESS_APPLICATION_AUD_TAG"
R2_ACCOUNT_ID = "REPLACE_WITH_REAL_R2_ACCOUNT_ID"
R2_BUCKET_NAME = "divine-motion-v2-media-local"

[env.staging.vars]
CF_ACCESS_TEAM_DOMAIN = "REPLACE_WITH_REAL_STAGING_TEAM_DOMAIN.cloudflareaccess.com"
CF_ACCESS_AUD = "REPLACE_WITH_REAL_STAGING_ACCESS_APPLICATION_AUD_TAG"
R2_ACCOUNT_ID = "80690274479b4a7f525a8d4c768404bf"
R2_BUCKET_NAME = "divine-motion-v2-media-staging"

# Production Access/R2 config is deliberately NOT declared here — same
# reasoning as the D1 section above. Set via Cloudflare dashboard
# environment variables / secrets at deploy time, never in this file.

# ---------------------------------------------------------------------------
# R2 — Media Library + Upload Foundation (Implementation Brief 014).
# Binding: MEDIA. The native R2Bucket binding (env.MEDIA — see
# src/lib/storage/env.ts) is used server-side ONLY, for the
# /upload-complete verification step (HEAD/GET the object the browser just
# PUT) and the admin preview/delivery route — never to generate a
# browser-usable upload URL (the binding has no API for that). Direct
# browser -> R2 upload instead uses a presigned S3-API PUT URL (see the
# R2 S3 API config above and ADR-017).
#
# Local: same placeholder-id convention as the D1 section above — not a
# real Cloudflare resource, only a key for Miniflare's local R2 emulation.
# No `wrangler r2 bucket create` has been run against any real account.
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "divine-motion-v2-media-local"

[[env.staging.r2_buckets]]
binding = "MEDIA"
# NOT provisioned by this repo — `wrangler r2 bucket create
# divine-motion-v2-media-staging` must be run once, manually, against the
# real Cloudflare account (see docs/DEPLOYMENT.md "R2 environments").
bucket_name = "divine-motion-v2-media-staging"

# Production R2 binding is deliberately NOT declared here — same reasoning
# as D1/Access above.
